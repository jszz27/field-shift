# Render Blueprint for the Field Shift API (backend/). Render reads this file when you
# create a Blueprint from the GitHub repo: Dashboard > New > Blueprint.
services:
  - type: web
    name: field-shift-api
    runtime: python
    plan: free                      # sleeps after ~15 min idle; the next visit wakes it (~1 min)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/demo-sites
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CORS_ORIGINS           # the website's address, e.g. https://field-shift.vercel.app
        sync: false                 # Render asks for it when the Blueprint is created
